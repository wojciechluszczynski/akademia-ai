<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Załóż konto — Akademia AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="glow-bg"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-top">
      <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 18px;">
        <img src="assets/logo-aa.svg" width="28" height="28" alt="AA" style="border-radius:6px;">
        Akademia AI
      </a>
      <div class="auth-title" id="page-title">Załóż darmowe konto</div>
      <div class="auth-sub" id="page-sub">2 odcinki · 3 pliki Vault · zero karty kredytowej</div>
    </div>

    <div class="alert alert-err" id="err"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Imię i nazwisko</label>
        <input type="text" class="form-input" id="name" placeholder="Jan Kowalski" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="email" placeholder="ty@firma.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Hasło</label>
        <input type="password" class="form-input" id="password" placeholder="min. 8 znaków" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-xl" id="submit-btn">Załóż konto</button>
    </form>

    <div class="security-note">
      <span style="color: var(--orange);">●</span>
      <div>Twoje konto chronione tokenem sesyjnym. Każde nowe logowanie unieważnia poprzednie sesje.</div>
    </div>

    <div class="auth-footer-note">
      Masz już konto? <a href="login.html">Zaloguj się</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  (async function () {
    await window.AkademiaAuth.redirectIfLoggedIn();
  })();

  // Detect plan from URL and adjust copy
  const urlParams = new URLSearchParams(window.location.search);
  const plan = urlParams.get('plan'); // 'all' | 'single' | null

  if (plan === 'all') {
    document.getElementById('page-title').textContent = 'Kup dostęp do wszystkich serii';
    document.getElementById('page-sub').textContent = '36 odcinków · dożywotni dostęp · płacisz raz';
    document.getElementById('submit-btn').textContent = 'Kup dostęp · 249 PLN →';
  } else if (plan === 'single') {
    document.getElementById('page-title').textContent = 'Kup dostęp do wybranej serii';
    document.getElementById('page-sub').textContent = '12 odcinków · dożywotni dostęp · płacisz raz';
    document.getElementById('submit-btn').textContent = 'Wybierz serię · 97 PLN →';
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Tworzenie konta...';
    try {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result   = await window.AkademiaAuth.register(name, email, password);
      const user     = result?.user;

      if (plan === 'all') {
        if (user?.id) {
          window.location.href = `/api/create-checkout?plan=all&userId=${user.id}&email=${encodeURIComponent(email)}`;
        } else {
          // Email confirmation still pending — send to login with hint
          window.location.href = `login.html?plan=all&email=${encodeURIComponent(email)}&msg=confirm`;
        }
      } else if (plan === 'single') {
        window.location.href = 'dashboard.html?upgrade=1';
      } else {
        window.location.href = 'dashboard.html';
      }
    } catch (e) {
      const msg = e.message || '';
      const isExisting = msg.toLowerCase().includes('invalid') || msg.toLowerCase().includes('already') || msg.toLowerCase().includes('registered');
      if (isExisting && plan) {
        err.innerHTML = `Ten email jest już zarejestrowany. <a href="login.html?plan=${plan}&email=${encodeURIComponent(document.getElementById('email').value.trim())}" style="color:var(--orange);font-weight:600;">Zaloguj się →</a>`;
      } else {
        err.textContent = msg;
      }
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = plan === 'all' ? 'Kup dostęp · 249 PLN →' : plan === 'single' ? 'Wybierz serię · 97 PLN →' : 'Załóż konto';
    }
  });
</script>

</body>
</html>
