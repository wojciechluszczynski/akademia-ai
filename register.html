<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Załóż konto — Akademia AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="glow-bg"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-top">
      <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 18px;">
        <span class="logo-mark">AA</span>
        Akademia AI
      </a>
      <div class="auth-title">Załóż darmowe konto</div>
      <div class="auth-sub">2 odcinki · 3 pliki Vault · zero kredytówki</div>
    </div>

    <div class="alert alert-err" id="err"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Imię i nazwisko</label>
        <input type="text" class="form-input" id="name" placeholder="Jan Kowalski" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="email" placeholder="ty@firma.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Hasło</label>
        <input type="password" class="form-input" id="password" placeholder="min. 8 znaków" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-xl" id="submit-btn">Załóż konto</button>
    </form>

    <div class="security-note">
      <span style="color: var(--orange);">●</span>
      <div>Twoje konto chronione tokenem sesyjnym. Każde nowe logowanie unieważnia poprzednie sesje — koniec z dzieleniem hasła.</div>
    </div>

    <div class="auth-footer-note">
      Masz już konto? <a href="login.html">Zaloguj się</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  (async function () {
    await window.AkademiaAuth.redirectIfLoggedIn();
  })();

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Tworzenie konta...';
    try {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await window.AkademiaAuth.register(name, email, password);
      window.location.href = 'dashboard.html';
    } catch (e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Załóż konto';
    }
  });
</script>

</body>
</html>
